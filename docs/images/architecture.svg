<!--
architecture.svg - How the CONNX MCP Server sits between an AI harness and your data sources, with its optional
sign-in services. Drawn by hand in the style of the Adabas & Natural container architecture: blue frames for machines
and containers, purple for the server's own parts, teal for the customer's, dashed for what is optional. Edit this
file, then render architecture.png and its .sha256 sidecar again. Keep the width and height on the root element: the
renderer screenshots that size.


    on an "AS IS" BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the License
    for the specific language governing permissions and limitations under the License.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
  <title>The CONNX MCP Server runs in a Docker container between an AI harness and your data sources</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#8E3CF7" stroke-width="1.6"/>
    </marker>
    <style>
      .frame { fill: #FFFFFF; stroke: #3C9BF7; stroke-width: 2; }
      .optional { stroke-dasharray: 7 5; }
      .title { font-size: 16px; font-weight: bold; text-anchor: middle; }
      .server { fill: #FFFFFF; stroke: #8E3CF7; stroke-width: 3; }
      .yours { fill: #FFFFFF; stroke: #3CC1B7; stroke-width: 3; }
      .label { font-size: 14px; fill: #1C3752; text-anchor: middle; }
      .small { font-size: 12px; fill: #1C3752; text-anchor: middle; }
      .line { fill: none; stroke: #8E3CF7; stroke-width: 2; marker-end: url(#arrow); }
      .dotted { stroke-dasharray: 3 4; }
      .left { text-anchor: start; }
    </style>
  </defs>
  <rect width="960" height="470" fill="#FFFFFF"/>

  <!-- Your workstation -->
  <rect class="frame" x="20" y="60" width="210" height="230" rx="6"/>
  <text class="title" x="125" y="88" fill="#3CC1B7">Your workstation</text>
  <rect class="yours" x="40" y="120" width="170" height="60"/>
  <text class="label" x="125" y="146">AI harness</text>
  <text class="small" x="125" y="166">Claude Code, Codex, …</text>
  <rect class="yours" x="40" y="215" width="170" height="50"/>
  <text class="label" x="125" y="245">connx-sql-expert skill</text>

  <!-- The server's container -->
  <rect class="frame" x="300" y="60" width="270" height="230" rx="6"/>
  <text class="title" x="435" y="88" fill="#8E3CF7">CONNX MCP Server</text>
  <text class="title" x="435" y="108" fill="#8E3CF7">in a Docker container</text>
  <rect class="server" x="345" y="125" width="180" height="50"/>
  <text class="label" x="435" y="155">MCP server</text>
  <rect class="server" x="345" y="215" width="180" height="50"/>
  <text class="label" x="435" y="245">CONNX engine</text>
  <path class="line" d="M435,175 V213"/>

  <!-- The CDD, mounted into the container -->
  <path class="yours" d="M375,370 V420 A60,12 0 0 0 495,420 V370"/>
  <ellipse class="yours" cx="435" cy="370" rx="60" ry="12"/>
  <text class="label" x="435" y="405">CDD</text>
  <path class="line" d="M435,356 V292"/>
  <text class="small left" x="445" y="320">mounted</text>
  <text class="small left" x="445" y="336">read-only</text>

  <!-- Sign-in services, optional -->
  <rect class="frame optional" x="660" y="20" width="280" height="150" rx="6"/>
  <text class="title" x="800" y="48" fill="#3CC1B7">Your sign-in services</text>
  <rect class="yours optional" x="675" y="80" width="120" height="60"/>
  <text class="label" x="735" y="106">Identity</text>
  <text class="label" x="735" y="124">provider</text>
  <rect class="yours optional" x="805" y="80" width="120" height="60"/>
  <text class="label" x="865" y="106">HashiCorp</text>
  <text class="label" x="865" y="124">Vault</text>
  <path class="line dotted" d="M525,150 H600 V95 H658"/>

  <!-- Data sources -->
  <rect class="frame" x="660" y="200" width="280" height="110" rx="6"/>
  <text class="title" x="800" y="228" fill="#3CC1B7">Your data sources</text>
  <rect class="yours" x="710" y="240" width="180" height="55"/>
  <text class="label" x="800" y="263">Data sources</text>
  <text class="small" x="800" y="282">Adabas, VSAM, Db2, …</text>
  <path class="line" d="M525,240 H600 V267 H708"/>
  <text class="small" x="630" y="232">TCP/IP</text>

  <!-- Harness to server -->
  <path class="line" d="M210,150 H343"/>
  <text class="small" x="265" y="142">MCP</text>

  <!-- Legend -->
  <rect class="server" x="600" y="370" width="22" height="14"/>
  <text class="small left" x="630" y="382">Part of the CONNX MCP Server</text>
  <rect class="yours" x="600" y="396" width="22" height="14"/>
  <text class="small left" x="630" y="408">Yours</text>
  <rect class="yours optional" x="600" y="422" width="22" height="14"/>
  <text class="small left" x="630" y="434">Optional</text>
</svg>

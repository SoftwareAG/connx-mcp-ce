#   for the specific language governing permissions and limitations under the License.
#
# Each person signs in to Keycloak and dex with their name as both username and password (dex asks for the
# email, <name>@example.com). Their queries run under the CONNX login you map them to below; those logins come
# from the CONNX Data Dictionary (CDD) your server uses - this file names them, it never creates them.
#
# Map at least one person before `connx-mcp-ce start-demo`: uncomment their `connx:` line and fill in a login from
# your CDD. A person with no `connx:` line signs in but is refused by the server (no Credential Vault entry).
#
# Per identity you may also set: password, email, providers ([keycloak, dex]); any password as
# `password_env: VARIABLE` to read it from that environment variable instead. On `connx:` the keys are
# username, password (or password_env) and restricted (true when the CDD refuses that login some tables).
# Add, rename or remove people freely; each needs its own name and id (any unique string). Changing an id
# re-keys that person's Credential Vault entry.

identities:
